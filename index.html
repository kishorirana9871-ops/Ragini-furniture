<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रागिनी फर्नीचर</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; text-align: center; }
        h1 { color: #8B4513; }
        .card { background: white; padding: 15px; margin: 15px auto; max-width: 300px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .card img { width: 100%; border-radius: 5px; }
        .btn { background-color: #25D366; color: white; padding: 10px 15px; text-decoration: none; display: inline-block; font-weight: bold; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🪑 रागिनी फर्नीचर 🛋️</h1>
    <p>उत्तम गुणवत्ता का फर्नीचर - सीधे ऑर्डर करें!</p>

    <!-- आइटम 1 -->
    <div class="card">
        <h3>डबल बेड (Sagwan Wood)</h3>
        <p>कीमत: ₹15,000</p>
        <!-- यहाँ आपका नंबर सेट है -->
        <a href="https://wa.me/918700801078?text=नमस्ते,%20मुझे%20डबल%20बेड%20का%20ऑर्डर%20देना%20है।" class="btn">WhatsApp पर ऑर्डर करें</a>
    </div>

    <!-- आइटम 2 -->
    <div class="card">
        <h3>5 सीटर सोफा सेट</h3>
        <p>कीमत: ₹18,000</p>
        <!-- यहाँ भी आपका नंबर सेट है -->
        <a href="https://wa.me/918700801078?text=नमस्ते,%20मुझे%20सोफा%20सेट%20का%20ऑर्डर%20देना%20है।" class="btn">WhatsApp पर ऑर्डर करें</a>
    </div>

</body>
</html>
