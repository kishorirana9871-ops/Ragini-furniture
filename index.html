<style>
body{background:#111;color:#fff;font-family:Arial;text-align:center;padding:20px}
h1{font-size:38px;font-weight:900}
.gold{color:#FFD700}
.btn{background:#FFD700;color:#000;padding:15px 25px;border:none;border-radius:8px;font-weight:bold;font-size:18px;margin:10px;cursor:pointer}

<body>
<h1>RAGINI<br>FURNITURE</h1>
<h3 class="gold">DELHI KA NO.1 LUXURY SOFA MANUFACTURER</h3>
<p>Direct Factory Se - Chhattarpur, Delhi<br>Call: 8384091419 | 8700801078</p>

<div class="box">
<h3>🪑 Pi Se Furniture Kharido</h3>
<p>Pi Network Se Payment Kare</p>
<button class="btn" onclick="loginPi()"> Pi Login </button>
<button class="btn" onclick="payPi()"> Pi Se Pay Kare (0.001 Pi)</button>

</div>

<a href="https://wa.me/918384091419?text=Hi%20Ragini%20Furniture" target="_blank"><button class="btn">WhatsApp</button></a>
<a href="tel:+918384091419"><button class="btn">Call Karein</button></a>

<script>
function loginPi(){
 Pi.authenticate(['username','payments'], function(p){ 
   document.getElementById('status').innerText = "Welcome " + p.user.username;
 });
}
function payPi(){
 Pi.createPayment({
   amount: 0.001,
   memo: "Ragini Furniture Sofa Booking",
   metadata: { product: "Luxury Sofa" }
 }, {
   onReadyForServerApproval: function(id){ console.log(id); },
   onReadyForServerCompletion: function(id, tx){ alert("Payment Success!"); },
   onCancel: function(id){ alert("Cancelled"); },
   onError: function(e){ alert("Error: "+e); }
 });
}
</script>
